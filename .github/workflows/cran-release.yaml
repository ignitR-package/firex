name: CRAN release candidate

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/cran-release.yaml"

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-tinytex@v2

      - name: Install HTML Tidy
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes tidy

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Build source package
        id: build
        shell: bash
        run: |
          R CMD build --compact-vignettes=gs+qpdf .
          tarball="$(find . -maxdepth 1 -name 'firex_*.tar.gz' -print -quit)"
          test -n "$tarball"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Check source package as CRAN
        shell: bash
        run: R CMD check --as-cran "${{ steps.build.outputs.tarball }}"

      - name: Upload CRAN release candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firex-cran-release
          path: |
            firex_*.tar.gz
            firex.Rcheck/00check.log
          if-no-files-found: error
          retention-days: 14
